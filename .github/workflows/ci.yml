name: Native macOS checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Config/**'
      - 'Fixtures/**'
      - 'PhotoAxis.xcodeproj/**'
      - 'scripts/check.sh'
      - 'scripts/build.sh'
      - 'scripts/environment.sh'
      - 'scripts/generate-project.py'
      - 'scripts/check-localization.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-09-20
        with:
          persist-credentials: false
      - name: Record and validate toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers
      - name: Model and geometry tests; Debug build
        run: ./scripts/check.sh
      - name: Release build with local ad-hoc signing
        run: ./scripts/build.sh Release
