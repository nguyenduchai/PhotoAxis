name: PhotoAxis website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.py'
      - 'scripts/check-website.py'
      - 'scripts/check-pages-live.py'
      - 'scripts/package-website.py'
      - '.github/workflows/pages.yml'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate and validate bilingual website
        run: |
          python3 scripts/build-website.py
          git diff --exit-code -- website
          python3 scripts/check-website.py
          python3 scripts/package-website.py .release-artifacts/pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .release-artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify anonymous HTTPS, file hashes and deployed commit
        run: |
          for attempt in 1 2 3 4; do
            if python3 scripts/check-pages-live.py --url https://nguyenduchai.github.io/PhotoAxis/ --commit "${{ github.sha }}" --output .release-artifacts/pages-https.json; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Preserve HTTPS verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-https-proof
          path: .release-artifacts/pages-https.json
          retention-days: 30
